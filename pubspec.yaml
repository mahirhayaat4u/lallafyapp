name: giftswale
description: "GiftsWale — Multi-vendor gifting marketplace app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ─────────────────────────────────────────────────────────────────
# Dependencies
#
# 💡 React Native / Web equivalents:
#   - dio ↔ axios (HTTP client with interceptors)
#   - flutter_riverpod ↔ zustand (state management)
#   - go_router ↔ react-navigation / react-router
#   - flutter_secure_storage ↔ @react-native-async-storage
#   - cached_network_image ↔ react-native-fast-image
#   - carousel_slider ↔ react-native-snap-carousel
#   - shimmer ↔ react-native-shimmer-placeholder
# ─────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management ──
  flutter_riverpod: ^2.6.1       # Like Zustand — reactive state management

  # ── HTTP & Networking ──
  dio: ^5.7.0                    # Like Axios — HTTP client with interceptors

  # ── Routing ──
  go_router: ^14.8.1             # Like React Navigation — declarative routing

  # ── Storage ──
  flutter_secure_storage: ^9.2.4 # Like AsyncStorage but encrypted — for tokens
  shared_preferences: ^2.3.5     # Like AsyncStorage — for non-sensitive data

  # ── Image & Media Loading ──
  cached_network_image: ^3.4.1   # Like FastImage — cached network images
  video_player: ^2.9.2           # For playing bestseller video clips

  # ── UI Components ──
  carousel_slider: ^5.0.0        # For hero banner carousel
  shimmer: ^3.0.0                # Skeleton loading placeholders
  smooth_page_indicator: ^1.2.0  # Page indicator dots for carousels

  # ── Utilities ──
  intl: ^0.19.0                  # Date/number formatting & i18n
  url_launcher: ^6.3.1           # Open URLs, phone, email
  flutter_svg: ^2.0.16           # SVG rendering
  razorpay_flutter: ^1.3.7       # Razorpay payment gateway SDK

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/iconapp.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/iconapp.png"

flutter:
  uses-material-design: true

  # ── Assets ──
  assets:
    - assets/images/

